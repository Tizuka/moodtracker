apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-name
  # criando um Deploymentrecurso que gerencia Pods automaticamente
spec:
  selector:
    matchLabels:
      app: pods-under-deployment
      # sse Deployment controla Pods que possuem a label app=deployment-pods-management.
  replicas: 2
  template:
    metadata:
      labels:
        app: pods-under-deployment
        # criacao da label para o Pod, que sera controlado pelo Deployment.
    spec:
      containers:
        # o nome do container.
        - name: container-name
          image: devops-server:v2
          imagePullPolicy: Never
          ports:
            - containerPort: 4000
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  # servico que referencia o arquivo de secrets.yaml
                  key: MONGO_URI

          # [OBSERVABILIDADE] Health checks
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: code-deployment-service-name
spec:
  type: NodePort
  selector:
    app: pods-under-deployment
  ports:
    - port: 4000
      targetPort: 4000
