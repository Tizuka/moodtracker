apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  selector:
    matchLabels:
      app: batata-doce
  replicas: 2
  template:
    metadata:
      labels:
        app: batata-doce
    spec:
      containers:
        - name: projeto-devops
          image: devops-server:v2
          imagePullPolicy: Never
          ports:
            - containerPort: 4000
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: MONGO_URI

          # [OBSERVABILIDADE] Health checks
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: NodePort
  selector:
    app: batata-doce
  ports:
    - port: 4000
      targetPort: 4000
