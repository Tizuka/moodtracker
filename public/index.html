<body>
    <div>
        <nav>

        <div class="box-align">

            <!-- <h3 class="title">Mood Tracker</h3>  -->
            <h1>Mood Tracker: How are you feeling today?</h1>
            <div id="parent-id" class="image-box parent">
                <button class="button-mood" data-mood="happy"><img class="image-size" src="images/happy.png"

                <button class="button-mood" data-mood="neutral"><img class="image-size" src="images/neutral.png"

                <button class="button-mood" data-mood="sad"><img class="image-size" src="images/sad.png"
                        alt="sad"></button>
            </div>
            <div>
                <button type="submit" class="btn-submit">Submit</button>
            </div>

        </div>
